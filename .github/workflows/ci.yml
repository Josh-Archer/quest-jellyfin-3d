name: CI
on:
  push:
  pull_request:
jobs:
  check:
    # ARC scale set from Josh-Archer/home PR #3956.
    runs-on: home-gh-runner-quest-jellyfin-3d
    steps:
      - uses: actions/checkout@v4
      # DeskQuest is private. The repository secret contains a read-only deploy key.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DESKQUEST_DEPLOY_KEY }}
      - name: Fetch DeskQuest through its deploy key
        run: git config --global url."git@github.com:Josh-Archer/DeskQuest".insteadOf "https://github.com/Josh-Archer/DeskQuest"
      - run: echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libvulkan-dev || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: crates/quest-app/android/tests/run.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
