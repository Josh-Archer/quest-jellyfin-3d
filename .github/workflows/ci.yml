name: CI
on:
  push:
  pull_request:
jobs:
  check:
    # ARC scale set from Josh-Archer/home PR #3956.
    runs-on: home-gh-runner-quest-jellyfin-3d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libvulkan-dev || true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify questkit crates are consumed as registry dependencies
        # They must be versioned dependencies, never workspace members or path copies, and the
        # Android packaging harness must resolve from the resolved xr-core package.
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > /tmp/metadata.json
          python3 - <<'PY'
          import json, os
          d = json.load(open("/tmp/metadata.json"))
          members = set(d["workspace_members"])
          for name in ("xr-core", "xr-video", "jellyfin-client"):
              pkg = next(p for p in d["packages"] if p["name"] == name)
              assert pkg["id"] not in members, f"{name} must not be a workspace member"
              src = pkg["source"] or ""
              assert src.startswith(("registry+", "git+")), f"{name} resolved from {src!r}"
              print(name, pkg["version"], src)
              if name == "xr-core":
                  assert os.path.isfile(os.path.join(os.path.dirname(pkg["manifest_path"]), "android", "build.sh"))
          PY
      - run: crates/quest-app/android/tests/run.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
