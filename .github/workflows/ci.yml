name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    # ARC scale set from Josh-Archer/home PR #3956.
    runs-on: home-gh-runner-quest-jellyfin-3d
    steps:
      - uses: actions/checkout@v4
      # DeskQuest is public: cargo fetches the pinned git deps over anonymous HTTPS (no SSH/deploy key).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libvulkan-dev || true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
