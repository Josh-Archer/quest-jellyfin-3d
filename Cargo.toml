[workspace]
resolver = "2"
members = [
    "crates/jellyfin",
    "crates/jellyfin-player",
    "crates/quest-jellyfin-player",
    "crates/quest-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Josh Archer <jarcher1200@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Josh-Archer/quest-jellyfin-3d"

[workspace.dependencies]
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
url = { version = "2.5", features = ["serde"] }
wiremock = "0.6"
# Shared XR/video crates from DeskQuest, pinned; not copied. Includes xr_video::format (DeskQuest#220).
xr-core = { git = "https://github.com/Josh-Archer/DeskQuest", rev = "6e2b0ece2bbbfe0810a7d71a8d4d14f23f6737c3" }
xr-video = { git = "https://github.com/Josh-Archer/DeskQuest", rev = "6e2b0ece2bbbfe0810a7d71a8d4d14f23f6737c3" }
